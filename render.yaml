services:
  # Django Backend Service
  - type: web
    name: worknest-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn worknest.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: worknest-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
    rootDir: backend
    
databases:
  # PostgreSQL Database
  - name: worknest-db
    databaseName: worknest
    user: worknest
